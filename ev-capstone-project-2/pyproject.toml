[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "java-cve-reachability-analyzer"
version = "1.0.0"
description = "AI-Orchestrated Java CVE Reachability Analyzer using LangChain and LangGraph"
authors = [{ name = "Security Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "javalang>=0.13.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
cve-reachability = "cve_analyzer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
